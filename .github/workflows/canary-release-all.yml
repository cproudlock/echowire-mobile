name: Canary Release (Android)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  android-fcm:
    name: Android FCM build
    uses: ./.github/workflows/android-canary-fcm.yml
    secrets: inherit

  android-oss:
    name: Android OSS build
    uses: ./.github/workflows/android-canary-oss.yml
    secrets: inherit
