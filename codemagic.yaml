# Codemagic CI — iOS only (Android is built on the Linux workstation).
#
# One-time setup in the Codemagic UI before the first run:
#   1. Teams → Integrations → App Store Connect: add an API key (from
#      App Store Connect → Users and Access → Integrations). Name it exactly
#      "Echowire App Store Connect" (or change the name under `integrations` below).
#      This key does automatic code signing for the app AND its two extensions
#      (BroadcastExtension, NotificationService) — no manual .mobileprovision needed.
#   2. App settings → Environment variables, group `echowire_ios`:
#        GOOGLE_SERVICE_INFO_PLIST  = base64 of ios/Runner/GoogleService-Info.plist  (mark Secure)
#        APP_STORE_APP_ID           = the numeric Apple ID of the app in App Store Connect
#        CERTIFICATE_PRIVATE_KEY    = raw PEM RSA private key, NOT base64 (mark Secure).
#                                     Used by fetch-signing-files to create/save the iOS
#                                     Distribution certificate. Without it the signing step
#                                     fails: "Cannot save Signing Certificates without
#                                     certificate private key". Generate a fresh one with:
#                                       openssl genrsa 2048 | openssl rsa -traditional
#      Generate the plist value with:
#        base64 -w0 ios/Runner/GoogleService-Info.plist
#   3. Point this workflow at the `canary` branch (default) or `main`.

workflows:
  ios-testflight:
    name: Echowire iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Echowire App Store Connect
    environment:
      groups:
        - echowire_ios
      vars:
        BUNDLE_ID: "org.echowire.ios"
        APP_STORE_APPLE_TEAM_ID: "34589PFK6A"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore Firebase iOS config
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
      - name: Flutter pub get
        script: flutter pub get
      - name: Generate code (build_runner)
        # *.g.dart / *.freezed.dart are gitignored, so CI must generate them
        # (Riverpod providers, Drift DAOs, etc.) before compiling — same as the
        # Android GitHub Actions workflow. Without this the archive fails with
        # "ref/messageUploadSessionsProvider/channelDao isn't defined".
        script: dart run build_runner build --delete-conflicting-outputs
      - name: CocoaPods install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Automatic code signing (app + extensions)
        script: |
          set -e
          # Fetch/create App Store profiles for the main app and all three extensions.
          # CERTIFICATE_PRIVATE_KEY (secure env var, group echowire_ios, raw PEM — NOT base64)
          # is required to create/save the Distribution certificate. Without it the CLI aborts
          # with "Cannot save Signing Certificates without certificate private key".
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.BroadcastExtension" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.NotificationService" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.ShareExtension" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA (stable flavor)
        script: |
          set -e
          # Next TestFlight build number for this app version.
          NEXT=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 56)
          BUILD_NUMBER=$((NEXT + 1))
          flutter build ipa --release \
            --flavor stable \
            --no-tree-shake-icons \
            --dart-define-from-file=tool/dart_defines/stable.json \
            --dart-define=PUSH_PROVIDER=apns \
            --build-number=$BUILD_NUMBER \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Only EXTERNAL groups go here (internal groups auto-receive builds and
        # the API rejects assigning to them). "Public Beta" is an external group;
        # its first build per version goes through Apple Beta App Review before
        # external testers (via the public link) can install.
        beta_groups:
          - Public Beta
